name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

      - name: Check local assets
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          missing = []
          for value in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', html):
              if value.startswith(('http://','https://','mailto:','tel:','#','data:')):
                  continue
              clean = value.split('#',1)[0].split('?',1)[0]
              if clean and not (root / clean).exists():
                  missing.append(clean)
          if missing:
              print('Missing local assets:', *missing, sep='\n- ')
              sys.exit(1)
          PY

      - name: Check local-only demo contract
        run: |
          grep -Fq "Nie wysyła danych ani wiadomości" index.html
          grep -Fq "approvalRequired: true" lib/offer-engine.mjs
          if grep -E '\b(fetch|XMLHttpRequest|WebSocket)\s*\(' app.js lib/offer-engine.mjs; then
            echo "External network code found in local-only demo."
            exit 1
          fi
